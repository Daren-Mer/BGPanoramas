<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00143C">
<meta name="apple-mobile-web-app-capable" content="yes">
{{ROBOTS}}
<title>{{TITLE}} · {{COMPANY}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
{{OG}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<link rel="icon" type="image/png" href="{{ASSETS}}/brand/favicon.png">
<link rel="apple-touch-icon" href="{{ASSETS}}/brand/apple-touch-icon.png">
<link rel="stylesheet" href="{{ASSETS}}/vendor/pannellum.css">
<link rel="stylesheet" href="{{ASSETS}}/app.css">
<style>:root{--accent:{{ACCENT}}}</style>
</head>
<body class="viewer">
<div id="pano" aria-label="360 degree panorama"></div>

<header class="bar top glass">
  <img class="brand-symbol" src="{{ASSETS}}/brand/bg-symbol-white.png" alt="Brasfield &amp; Gorrie" width="245" height="206">
  <div class="titles">
    <h1 id="project-title">{{TITLE}}</h1>
    <p id="scene-title"></p>
  </div>
  <button class="icon-btn" id="btn-info" aria-label="Pursuit info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg>
  </button>
</header>

<div class="side-controls">
  <button class="icon-btn glass" id="btn-gyro" aria-label="Look around by moving your phone" hidden>
    <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M3 8.5c-1.2 2.3-1.2 4.7 0 7M21 8.5c1.2 2.3 1.2 4.7 0 7"/><path d="M11 18.5h2"/></svg>
  </button>
  <button class="icon-btn glass" id="btn-full" aria-label="Full screen" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="icon-btn glass" id="btn-share" aria-label="Share">
    <svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>
  </button>
</div>

<div class="hint glass" id="hint" hidden><span class="hint-icon">⟲</span><span id="hint-text">Drag to look around</span></div>

<nav class="strip-wrap" id="strip-wrap" hidden>
  <button class="strip-toggle glass" id="strip-toggle" aria-expanded="true">
    <span id="strip-count"></span>
    <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
  </button>
  <div class="strip glass" id="strip" role="list"></div>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet glass" id="sheet-share" hidden aria-label="Share">
  <div class="sheet-grab"></div>
  <h2>Share this view</h2>
  <div class="qr-box"><canvas id="share-qr"></canvas></div>
  <p class="link-text" id="share-link"></p>
  <div class="sheet-actions">
    <button class="btn primary" id="btn-copy">Copy link</button>
    <button class="btn" id="btn-native-share" hidden>Share…</button>
  </div>
  <label class="check"><input type="checkbox" id="share-scene"> Open on <strong id="share-scene-name"></strong></label>
  <a class="small-link" href="qr/">Printable QR card →</a>
</section>
<section class="sheet glass" id="sheet-info" hidden aria-label="Pursuit info">
  <div class="sheet-grab"></div>
  <h2 id="info-title"></h2>
  <p class="muted" id="info-meta"></p>
  <p id="info-desc"></p>
  <div class="contact" id="info-contact"><img class="contact-logo" src="{{ASSETS}}/brand/bg-horizontal-white.png" alt="Brasfield &amp; Gorrie" width="867" height="98"></div>
  <p class="howto">Drag or swipe to look around · Pinch or scroll to zoom<span id="howto-gyro"> · Tap <b>phone</b> button to look by moving your device</span></p>
</section>
<div class="toast" id="toast" hidden></div>

<script type="application/json" id="data">{{DATA}}</script>
<script src="{{ASSETS}}/vendor/pannellum.js"></script>
<script src="{{ASSETS}}/vendor/qrcode.js"></script>
<script src="{{ASSETS}}/qr.js"></script>
<script src="{{ASSETS}}/viewer.js"></script>
</body>
</html>
